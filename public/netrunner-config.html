// ── DATA ─────────────────────────────────────────────────────────────────────

// Topics and sources come from the server's single catalog (GET /api/catalog), loaded
// before this script compiles — no more hand-synced copy of the feed list here.
const TOPICS  = window.NR_CATALOG.topics;
const SOURCES = window.NR_CATALOG.sources;

const TIMEZONES = [
  "America/New_York","America/Chicago","America/Denver","America/Los_Angeles",
  "America/Phoenix","America/Anchorage","Pacific/Honolulu","Europe/London",
  "Europe/Paris","Europe/Berlin","Asia/Tokyo","Asia/Shanghai","Asia/Dubai",
  "Asia/Kolkata","Australia/Sydney","Pacific/Auckland"
];

const buildDefaultSources = () => {
  const out = {};
  Object.values(SOURCES).forEach(types =>
    Object.values(types).forEach(list =>
      list.forEach(s => { out[s] = true; })
    )
  );
  return out;
};

// Catalog sources that are actually fetched — excludes xCancel, which is "Coming Soon"
// pending per-user X API key support (see Custom Sources tab). Shared by SourcesTab
// (per-category counts) and the dashboard's total SOURCES stat so both agree.
const COUNTABLE_SOURCE_SET = new Set(
  Object.values(SOURCES).flatMap(types =>
    Object.entries(types).filter(([type]) => type !== "xCancel").flatMap(([, list]) => list)
  )
);

const BLANK_CONFIG = {
  topics:  Object.fromEntries(TOPICS.map(t => [t, false])),
  sources: Object.fromEntries(Object.keys(buildDefaultSources()).map(k => [k, false])),
  delivery: { discord:false, email:false, emailAddress:"", textFile:false, openInApp:false, chatbotExport:false, chatbotPlatform:"chatgpt", outputPath:"", fileFormat:"md" },
  schedule: { enabled:true, morningTime:"07:00", nightlyTime:"20:00", timezone:"America/New_York", frequency:"twice_daily", skipWeekends:false, lookbackWindow:"12h" },
  llm:  { mode:"llm", primary:"gemini", fallbackChain:["claude","ollama"] },
  format: { summaryLength:"2-3", language:"English", sectionOrder:[...TOPICS], showExcluded:true, showEverythingElse:true },
  filters: { shorts:true, promotional:true },
  rollups: { weekly:false, monthly:false },
  customSources: { rss:[], youtube:[], xcancel:[] }
};

const DEFAULT_CONFIG = {
  ...BLANK_CONFIG,
  topics:  Object.fromEntries(TOPICS.map(t => [t, true])),
  sources: buildDefaultSources(),
};

// ── HELPERS ──────────────────────────────────────────────────────────────────

const deepClone = o => JSON.parse(JSON.stringify(o));

// NetRunner server REST API (same origin). Throws with the server's error message on non-2xx.
const api = async (path, { method = "GET", body, timeoutMs = 30000 } = {}) => {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(path, { method, signal: ctrl.signal,
      headers: body !== undefined ? { "Content-Type": "application/json" } : undefined,
      body: body !== undefined ? JSON.stringify(body) : undefined });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const detail = data.issues ? data.issues.map(i => `${i.path}: ${i.message}`).join("; ") : (data.error || "");
      throw Object.assign(new Error(`HTTP ${res.status}${detail ? " — " + detail : ""}`), { status: res.status, data });
    }
    return data;
  } catch (e) {
    if (e.name === "AbortError") throw new Error(`Timed out after ${Math.round(timeoutMs / 1000)}s`);
    throw e;
  } finally { clearTimeout(timer); }
};

const setPath = (obj, path, value) => {
  const keys = path.split(".");
  const next = deepClone(obj);
  let cur = next;
  for (let i = 0; i < keys.length - 1; i++) cur = cur[keys[i]];
  cur[keys[keys.length - 1]] = value;
  return next;
};

// ── NETRUNNER · n8n × CYBERPUNK TOKENS ────────────────────────────────────────
// orange  = n8n primary / enabled · crimson = HUD frame + alert · cyan = current selection

const C = {
  bg:       "#0c0809",
  bg2:      "#0f0a0c",
  panel:    "#16100f",
  panel2:   "#120c0d",

  muted:    "#857579",
  faint:    "#4d3c41",
  pill:     "#1a1214",
};

const F = {
  disp: "'Rajdhani', sans-serif",
  body: "'IBM Plex Sans', sans-serif",
  mono: "'IBM Plex Mono', monospace",
};

const NOTCH = "polygon(0 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%)";

const s = {
  card:   { background:C.panel, border:`1px solid ${C.border}`, borderRadius:5, padding:"22px 26px", marginBottom:16, position:"relative" },
  h1:     { fontFamily:F.disp, fontSize:34, fontWeight:700, color:C.text, margin:"0 0 4px", letterSpacing:"0.01em", lineHeight:1 },
  label:  { fontFamily:F.body, fontSize:12, color:C.muted, fontWeight:600, letterSpacing:"0.02em", display:"block", marginBottom:7 },

  sub:    { color:C.muted, fontSize:14, fontFamily:F.body, lineHeight:1.55 },

// ── SECTION HEADER ────────────────────────────────────────────────────────────

function SectionTitle({ children, hint }) {
  return (
    <div style={{ display:"flex", alignItems:"center", gap:11, marginBottom:18 }}>
      <span style={{ width:4, height:17, background:C.red, boxShadow:`0 0 9px ${C.red}99` }} />
      <span style={{ fontFamily:F.disp, fontSize:17, fontWeight:700, color:C.text, letterSpacing:"0.05em", textTransform:"uppercase" }}>{children}</span>
      {hint && <span style={{ fontFamily:F.body, fontSize:12.5, color:C.muted, marginLeft:2 }}>{hint}</span>}
    </div>
  );
}

// ── CONTROLS ──────────────────────────────────────────────────────────────────

function Toggle({ on, onChange }) {
  return (
    <div onClick={() => onChange(!on)} style={{ width:46, height:24, borderRadius:4, background: on ? C.orange : C.pill, border:`1px solid ${on ? C.orange : C.border}`, cursor:"pointer", position:"relative", transition:"all .18s", flexShrink:0, boxShadow: on ? `0 0 16px ${C.orange}55` : "none" }}>
      <div style={{ position:"absolute", top:3, left: on ? 24 : 3, width:16, height:16, borderRadius:3, background: on ? "#1a0d07" : C.faint, transition:"left .18s" }} />
    </div>
  );
}

function Radio({ on, onClick }) {
  return (
    <div onClick={onClick} style={{ width:20, height:20, borderRadius:"50%", border:`2px solid ${on ? C.cyan : C.border}`, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, boxShadow: on ? `0 0 12px ${C.cyan}55` : "none" }}>
      {on && <div style={{ width:8, height:8, borderRadius:"50%", background:C.cyan, boxShadow:`0 0 8px ${C.cyan}` }} />}
    </div>
  );
}

function Row({ label, sub, children }) {
  return (
    <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"13px 0", borderBottom:`1px solid ${C.border}`, gap:16 }}>
      <div>
        <div style={{ fontSize:15, fontFamily:F.body, color:C.text, fontWeight:500 }}>{label}</div>
        {sub && <div style={{ fontSize:13, fontFamily:F.body, color:C.muted, marginTop:2 }}>{sub}</div>}
      </div>
      {children}
    </div>
  );
}

// ── ANIMATED GLITCH BACKGROUND ────────────────────────────────────────────────

const BG_PATTERNS = ["scan","stream","bands","off"];
const BG_LABEL = { scan:"Scanline", stream:"Data Stream", bands:"Signal Bands", off:"Minimal" };

function GlitchBG({ pattern }) {
  const base = { position:"absolute", inset:0, pointerEvents:"none" };
  const layers = [];

  // shared: faint warm grid + vignette + right-edge red glow (cyberpunk ref)
  layers.push(React.createElement("div", { key:"grid", style:{ ...base, opacity:.5,
    backgroundImage:`linear-gradient(${C.red}0a 1px, transparent 1px), linear-gradient(90deg, ${C.red}0a 1px, transparent 1px)`,
    backgroundSize:"46px 46px" } }));
  layers.push(React.createElement("div", { key:"vig", style:{ ...base,
    background:`radial-gradient(125% 90% at 50% 0%, transparent 50%, ${C.bg} 100%)` } }));
  layers.push(React.createElement("div", { key:"glow", style:{ position:"absolute", top:0, bottom:0, right:0, width:160, pointerEvents:"none",
    background:`linear-gradient(270deg, ${C.red}1c, transparent)` } }));
  layers.push(React.createElement("div", { key:"edge", style:{ position:"absolute", top:"12%", bottom:"12%", right:0, width:3, pointerEvents:"none",
    background:C.red, boxShadow:`0 0 22px 3px ${C.red}88`, opacity:.7 } }));

  if (pattern === "scan") {
    layers.push(React.createElement("div", { key:"sl", style:{ ...base,
      background:"repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.22) 2px 3px)" } }));
    layers.push(React.createElement("div", { key:"sw", style:{ ...base,
      backgroundImage:`linear-gradient(90deg, transparent, ${C.orange}10 45%, ${C.red}14 55%, transparent)`,
      backgroundSize:"420px 100%", backgroundRepeat:"repeat", animation:"nr-sweep-x 5.5s linear infinite" } }));
  } else if (pattern === "stream") {
    for (let i = 0; i < 5; i++) {
      layers.push(React.createElement("div", { key:"st"+i, style:{ position:"absolute", left:0, right:0, height:1.5,
        top:(13 + i*17)+"%", pointerEvents:"none",
        backgroundImage:`repeating-linear-gradient(90deg, ${i%2 ? C.red : C.orange}26 0 18px, transparent 18px 46px)`,
        backgroundSize:"300px 100%", animation:`nr-stream-x ${3.2 + i*0.7}s linear infinite`, opacity:.8 } }));
    }
    layers.push(React.createElement("div", { key:"sl2", style:{ ...base, opacity:.5,
      background:"repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.16) 3px 4px)" } }));
  } else if (pattern === "bands") {
    layers.push(React.createElement("div", { key:"bd", style:{ ...base,
      background:"repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 8px, transparent 8px 22px)",
      animation:"nr-jitter 2.6s steps(3) infinite" } }));
    layers.push(React.createElement("div", { key:"bdr", style:{ ...base, mixBlendMode:"screen", opacity:.5,
      background:`repeating-linear-gradient(0deg, ${C.red}0c 0 8px, transparent 8px 22px)`,
      animation:"nr-jitter2 1.9s steps(2) infinite" } }));
    layers.push(React.createElement("div", { key:"sl3", style:{ ...base,
      background:"repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.20) 2px 3px)" } }));
  }
  return React.createElement("div", { style:{ position:"absolute", inset:0, zIndex:0, pointerEvents:"none", overflow:"hidden" } }, layers);
}

function N8nBadge({ status }) {
  const connected = status === "connected";
  const checking  = status === "checking";
  const dotColor  = checking ? C.muted : connected ? C.green : C.red;
  const label     = checking ? "server checking…" : connected ? "server connected" : "server offline";
  return (
    <div style={{ display:"inline-flex", alignItems:"center", gap:7, padding:"5px 11px", borderRadius:20,
      border:`1px solid ${connected ? C.orangeLn : checking ? C.border : C.redLn}`,
      background: connected ? C.orangeDim : checking ? "transparent" : C.redDim }}>
      <span style={{ width:7, height:7, borderRadius:"50%", background:dotColor, boxShadow:`0 0 8px ${dotColor}` }} />
      <span style={{ fontFamily:F.mono, fontSize:11, color: connected ? C.orange : checking ? C.muted : C.red, letterSpacing:"0.04em" }}>{label}</span>
    </div>
  );
}

function renderMD(md) {
  if (!md) return "";
  let html = md
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/^### (.+)$/gm, '<h3 class="md-h3">$1</h3>')
    .replace(/^## (.+)$/gm, '<h2 class="md-h2">$1</h2>')
    .replace(/^# (.+)$/gm, '<h1 class="md-h1">$1</h1>')
    .replace(/\[\*\*(.+?)\*\*\]\((.+?)\)/g, '<a class="md-link" href="$2" target="_blank" rel="noopener"><strong>$1</strong></a>')
    .replace(/\[(.+?)\]\((.+?)\)/g, '<a class="md-link" href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*\((.+?)\)\*/g, '<em class="md-source">($1)</em>')
    .replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>')
    .replace(/^---+$/gm, '<hr class="md-hr"/>')
    .replace(/^- (.+)$/gm, '<li class="md-li">$1</li>');
  html = html.replace(/(<li class="md-li">.*?<\/li>\n?)+/gs, m => `<ul class="md-ul">${m}</ul>`);
  html = html.split(/\n{2,}/).map(block => {
    if (/^<(h1|h2|h3|ul|hr)/.test(block.trim())) return block;
    const t = block.trim();
    return t ? `<p class="md-p">${t.replace(/\n/g, "<br/>")}</p>` : "";
  }).join("\n");
  return html;
}

  { id:"templates", label:"Start" },
  { id:"topics",    label:"Topics" },
  { id:"sources",   label:"Sources" },
  { id:"format",    label:"Format" },
  { id:"llm",       label:"AI Writer" },
  { id:"schedule",  label:"Schedule" },
  { id:"delivery",  label:"Delivery" },
  { id:"output",    label:"Output" },
];

// ── SECTIONS ──────────────────────────────────────────────────────────────────

function TemplatesTab({ onApply }) {

    <div>
      <h1 style={s.h1}>Get started</h1>
      <p style={{ ...s.sub, marginBottom:26 }}>Pick a starting point, then fine-tune everything in the steps that follow. Your digest runs on your NetRunner server.</p>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:18 }}>
        {[
          { id:"default", title:"Everything on", desc:"Every category and every source enabled — the complete digest as shipped.", tag:"RECOMMENDED", color:C.orange },
          { id:"blank",   title:"Start fresh", desc:"Every option off. Switch on only the topics and sources you care about.", tag:"BLANK", color:C.muted },
        ].map(t => (
          <div key={t.id} style={{ ...s.card, cursor:"pointer", marginBottom:0, transition:"border-color .15s", clipPath:NOTCH }}

               onMouseLeave={e => e.currentTarget.style.borderColor = C.border}>

            <div style={{ fontSize:14, fontFamily:F.body, color:C.muted, marginBottom:20, lineHeight:1.55 }}>{t.desc}</div>

function TopicsTab({ config, update }) {
  const allOn = TOPICS.every(t => config.topics[t]);
  const onCount = TOPICS.filter(t => config.topics[t]).length;
  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:20 }}>
        <div>
          <h1 style={s.h1}>Topics</h1>
          <span style={{ fontFamily:F.body, fontSize:14, color:C.muted }}>{onCount} of {TOPICS.length} categories tracked</span>
        </div>
        <button onClick={() => TOPICS.forEach(t => update(`topics.${t}`, !allOn))} style={{ ...s.btn, background:"transparent", color:C.orange, border:`1px solid ${C.orangeLn}` }}>
          {allOn ? "Turn all off" : "Turn all on"}
        </button>
      </div>
      <div style={s.card}>
        {TOPICS.map((t) => (
          <Row key={t} label={t}>
            <Toggle on={!!config.topics[t]} onChange={v => update(`topics.${t}`, v)} />
          </Row>
        ))}
      </div>
      <div style={s.card}>
        <SectionTitle hint="always at the end of the digest">Catch-all sections</SectionTitle>
        <Row label="📋 Everything Else" sub="Stories from your enabled sources that don't fit any topic above. When off, they're left out of Discord, email, the saved file and the Output tab (Output can still show them).">
          <Toggle on={config.format.showEverythingElse !== false} onChange={v => update("format.showEverythingElse", v)} />
        </Row>
        <Row label="🗒️ Excluded list" sub="Stories the AI skipped and why (duplicate, stale, filler…). Same on/off behaviour.">
          <Toggle on={config.format.showExcluded !== false} onChange={v => update("format.showExcluded", v)} />
        </Row>
      </div>
    </div>

}

function SourcesTab({ config, update }) {
  const [openCat, setOpenCat] = useState(null);

  const setAllInCategory = (allSrcs, value) => {
    const next = { ...config.sources };
    allSrcs.forEach(src => { next[src] = value; });
    update("sources", next);
  };

  return (
    <div>
      <h1 style={{ ...s.h1, marginBottom:6 }}>Sources</h1>
      <p style={{ ...s.sub, marginBottom:22 }}>Choose individual feeds per category. Only sources under an enabled topic get fetched.</p>
      <div style={s.card}>
        <SectionTitle hint="dropped before the AI sees them">Skip filler</SectionTitle>
        <Row label="Skip YouTube Shorts" sub="Drop Shorts from every channel, built-in and your own">
          <Toggle on={config.filters?.shorts !== false} onChange={v => update("filters.shorts", v)} />
        </Row>
        <Row label="Skip promo clips" sub="Movie/TV clips, featurettes, launch and accolades trailers, “now playing” spots, promo codes. Announcement and reveal trailers are kept.">
          <Toggle on={config.filters?.promotional !== false} onChange={v => update("filters.promotional", v)} />
        </Row>
      </div>
      {Object.entries(SOURCES).map(([cat, types]) => {
        const allSrcs = Object.values(types).flat();
        // xCancel is "Coming Soon" (not actually fetched yet) — exclude it from the countable/toggleable set
        // while still rendering it below via the untouched Object.entries(types) loop.
        // NOTE: filter by type key locally, not by name membership in a global set — several
        // categories (Gaming, TV & Movies, etc.) reuse the same account name across both an
        // xCancel entry and a real RSS/YouTube entry, and a name-based test would wrongly
        // let those xCancel entries back into the count via the collision.
        const countableSrcs = Object.entries(types).filter(([type]) => type !== "xCancel").flatMap(([, list]) => list);
        const topicOn = config.topics[cat] !== false;
        const enabledCount = topicOn ? countableSrcs.filter(src => config.sources[src]).length : 0;
        const open = openCat === cat;
        const pct = countableSrcs.length ? enabledCount / countableSrcs.length : 0;
        const allOn = countableSrcs.length > 0 && countableSrcs.every(src => config.sources[src]);
        return (
          <div key={cat} style={{ ...s.card, marginBottom:10, padding:0, overflow:"hidden", borderColor: open ? C.orangeLn : C.border, opacity: topicOn ? 1 : 0.45 }}>
            <div
              onClick={() => setOpenCat(open ? null : cat)}
              style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"16px 22px", cursor:"pointer", userSelect:"none" }}
            >
              <div style={{ display:"flex", alignItems:"center", gap:13 }}>
                <span style={{ width:8, height:8, borderRadius:"50%", background: !topicOn ? C.faint : pct === 0 ? C.faint : pct === 1 ? C.orange : C.red, boxShadow: topicOn && pct > 0 ? `0 0 9px ${pct === 1 ? C.orange : C.red}` : "none" }} />
                <span style={{ fontFamily:F.disp, fontSize:19, fontWeight:700, color:C.text, letterSpacing:"0.01em" }}>{cat}</span>
                <span style={{ fontFamily:F.body, fontSize:13, color:C.muted }}>{enabledCount}/{countableSrcs.length}</span>
                {!topicOn && <span style={{ fontFamily:F.mono, fontSize:10.5, color:C.red, letterSpacing:"0.05em", border:`1px solid ${C.redLn}`, background:C.redDim, borderRadius:3, padding:"2px 7px" }}>TOPIC OFF</span>}
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:14 }}>
                <span
                  onClick={e => { e.stopPropagation(); setAllInCategory(allSrcs, !allOn); }}
                  style={{ fontFamily:F.mono, fontSize:11, color:C.orange, letterSpacing:"0.04em", cursor:"pointer", border:`1px solid ${C.orangeLn}`, borderRadius:3, padding:"4px 9px" }}
                >
                  {allOn ? "Deselect all" : "Select all"}
                </span>
                <span style={{ display:"inline-flex", alignItems:"center", justifyContent:"center", width:24, height:24, transition:"transform .15s", transform: open ? "rotate(180deg)" : "none" }}>
                  <svg width="13" height="9" viewBox="0 0 12 8" fill="none"><path d="M1 1l5 5 5-5" stroke={open ? C.orange : "#857579"} strokeWidth="1.8" fill="none" strokeLinecap="round"/></svg>
                </span>
              </div>
            </div>
            {open && (
              <div style={{ borderTop:`1px solid ${C.border}`, padding:"16px 22px 20px", background:C.panel2 }}>
                {!topicOn && (
                  <p style={{ fontFamily:F.body, fontSize:12.5, color:C.red, marginBottom:14 }}>This topic is disabled on the Topics tab, so none of these sources will be fetched regardless of their state below.</p>
                )}
                {Object.entries(types).map(([type, list]) => {
                  const disabled = type === "xCancel";
                  return (
                  <div key={type} style={{ marginBottom:8 }}>
                    <span style={{ fontFamily:F.body, fontSize:12, fontWeight:600, color:C.muted, letterSpacing:"0.06em", textTransform:"uppercase", display:"block", margin:"10px 0 9px" }}>
                      {type === "xCancel" ? "X" : type}{disabled && <span style={{ marginLeft:8, fontFamily:F.mono, fontSize:10, letterSpacing:"0.04em", color:C.faint, textTransform:"none", border:`1px solid ${C.border}`, borderRadius:3, padding:"2px 7px" }}>COMING SOON</span>}
                    </span>
                    <div style={{ display:"flex", flexWrap:"wrap", gap:7, opacity: disabled ? 0.4 : 1 }}>
                      {list.map(src => {
                        const on = topicOn && !!config.sources[src];
                        return (
                          <div
                            key={src}
                            onClick={disabled ? undefined : () => update(`sources.${src}`, !config.sources[src])}
                            style={{ ...s.tag, cursor: disabled ? "default" : "pointer", background: on ? C.orangeDim : C.pill, borderColor: on ? C.orangeLn : C.border, color: on ? C.orange : C.muted }}
                          >
                            <span style={{ fontWeight:700, opacity: on ? 1 : .65 }}>{on ? "✓" : "+"}</span> {src}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// Shows whether a server-side secret is set in .env — the value itself never reaches the browser.
// Plain status text, deliberately not styled like an input or button: there's nothing to click.
// Keys and delivery settings stored in the server's .env, editable here. The server never sends a secret
// back: only whether it's set and its last 4 characters. Values are written straight into .env.
const KeysCtx = React.createContext({ keys:{}, saveKeys: async () => {} });

function KeyField({ k, label, secret = true, placeholder = "", help }) {
  const { keys, saveKeys } = React.useContext(KeysCtx);
  const st = keys[k] || { set:false };
  const [editing, setEditing] = useState(false);
  const [value, setValue] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  // Non-secret settings (host, port, user…) are shown and edited in place.
  const current = secret ? "" : (st.value || "");
  useEffect(() => { if (!secret) setValue(current); }, [current, secret]);
  const save = async (v) => {
    setBusy(true); setErr("");
    try { await saveKeys({ [k]: v }); setEditing(false); if (secret) setValue(""); }
    catch(e) { setErr(e.message); }
    setBusy(false);
  };
  const small = { ...s.btn, fontSize:13, padding:"7px 12px" };
  const ghost = { ...small, background:"transparent", color:C.orange, border:`1px solid ${C.orangeLn}` };
  return (
    <div style={{ marginBottom:16 }}>
      <label style={s.label}>{label}</label>
      {secret && !editing ? (
        <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
          <span style={{ fontFamily:F.body, fontSize:13.5, color: st.set ? C.body : C.red }}>
            <span style={{ color: st.set ? C.green : C.red, fontWeight:700, marginRight:8 }}>{st.set ? "✓" : "✕"}</span>
            {st.set ? (st.hint ? <>Saved <span style={{ fontFamily:F.mono, color:C.faint }}>••••{st.hint}</span></> : "Saved") : "Not set"}
          </span>
          <button style={ghost} onClick={() => { setEditing(true); setErr(""); }}>{st.set ? "Change" : "Add"}</button>
          {st.set && <button style={{ ...ghost, color:C.muted, borderColor:C.border }} disabled={busy} onClick={() => { if (window.confirm(`Remove ${label}?`)) save(""); }}>Clear</button>}
        </div>
      ) : (
        <div style={{ display:"flex", gap:8 }}>
          <input style={{ ...s.input, flex:1 }} type={secret ? "password" : "text"} autoComplete="off" spellCheck={false}
            value={value} placeholder={placeholder} onChange={e => setValue(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter" && (secret ? value.trim() : value !== current)) save(value.trim()); if (e.key === "Escape" && secret) setEditing(false); }} />
          {(secret || value !== current) && (
            <button style={small} disabled={busy || (secret && !value.trim())} onClick={() => save(value.trim())}>{busy ? "Saving…" : "Save"}</button>
          )}
          {secret && <button style={{ ...ghost, color:C.muted, borderColor:C.border }} onClick={() => { setEditing(false); setValue(""); }}>Cancel</button>}
        </div>
      )}
      {help && <p style={{ fontFamily:F.body, fontSize:11.5, color:C.faint, marginTop:7, marginBottom:0, lineHeight:1.5 }}>{help}</p>}
      {err && <p style={{ fontFamily:F.body, fontSize:12, color:C.red, marginTop:6, marginBottom:0 }}>{err}</p>}
    </div>
  );
}

function EnvFileLinks() {
  const open = how => api("/api/keys/open", { method:"POST", body:{ how } }).catch(e => window.alert("Couldn't open it: " + e.message));
  const link = { fontFamily:F.mono, fontSize:11.5, color:C.orange, cursor:"pointer", background:"none", border:"none", padding:0, textDecoration:"underline", textUnderlineOffset:3 };
  return (
    <p style={{ fontFamily:F.body, fontSize:12, color:C.faint, margin:"6px 0 0", lineHeight:1.6 }}>
      Saved to the server's .env file and used right away, no restart needed. Prefer editing by hand? <button style={link} onClick={() => open("file")}>Open .env</button> · <button style={link} onClick={() => open("folder")}>Show in folder</button>
    </p>
  );
}

// What's actually scheduled right now (Windows Task Scheduler, or the server's own timer elsewhere).
// Reflects the last Save — unsaved edits on this tab aren't scheduled yet.
function NextRuns() {
  const [info, setInfo] = useState(null);
  useEffect(() => {
    let alive = true;
    const load = () => api("/api/runs").then(r => alive && setInfo(r.next)).catch(() => alive && setInfo({ error:true }));
    load();
    const t = setInterval(load, 30000);
    return () => { alive = false; clearInterval(t); };
  }, []);
  const fmt = iso => iso ? new Date(iso).toLocaleString(undefined, { weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit" }) : "—";
  const jobs = info && !info.error ? info.jobs : [];
  return (
    <div style={s.card}>
      <SectionTitle hint={!info?.backend ? undefined : info.backend === "windows" ? "runs even when this window is closed" : "runs while the server is running"}>Next runs</SectionTitle>
      {!info && <p style={{ ...s.sub, margin:0 }}>Checking…</p>}
      {info?.error && <p style={{ ...s.sub, margin:0, color:C.red }}>Couldn't read the schedule from the server.</p>}
      {info && !info.error && !jobs.length && <p style={{ ...s.sub, margin:0 }}>Nothing scheduled.</p>}
      {jobs.map(j => (
        <div key={j.name} style={{ display:"flex", justifyContent:"space-between", gap:12, padding:"9px 0", borderBottom:`1px solid ${C.border}`, fontFamily:F.body, fontSize:14 }}>
          <span style={{ color:C.text, textTransform:"capitalize" }}>{j.name}</span>
          <span style={{ color:C.orange, fontFamily:F.mono, fontSize:12.5 }}>{fmt(j.next)}</span>
        </div>
      ))}
      {info?.backend === "windows" && (
        <p style={{ fontFamily:F.body, fontSize:12, color:C.faint, marginTop:12, marginBottom:0, lineHeight:1.5 }}>
          Scheduled through Windows Task Scheduler: digests run with NetRunner closed, can wake the PC from sleep, and a run missed while the PC was off starts when it's back on. Press Save to apply changes below.
        </p>
      )}
    </div>
  );
}

function ScheduleTab({ config, update }) {
  const freq = config.schedule.frequency;
  const morningActive = freq !== "weekly";
  const nightlyActive = freq === "twice_daily";
  const dimStyle = { opacity:0.35, pointerEvents:"none" };
  const enabled = config.schedule.enabled !== false;
  const LOOKBACK_OPTIONS = [
    { id:"12h", label:"12 hours" },
    { id:"24h", label:"24 hours" },
    { id:"3d",  label:"3 days" },
    { id:"1w",  label:"1 week" },
    { id:"2w",  label:"2 weeks" },
    { id:"1mo", label:"1 month" },
  ];
  return (
    <div>
      <h1 style={{ ...s.h1, marginBottom:20 }}>Schedule</h1>
      <div style={s.card}>
        <Row label="Automatic digests" sub={enabled ? "On: digests and recaps run on the schedule below" : "Off: nothing runs on its own. Use Run News Digest whenever you want one."}>
          <Toggle on={enabled} onChange={v => update("schedule.enabled", v)} />
        </Row>
      </div>
      <NextRuns />
      <div style={enabled ? {} : dimStyle}>
      <div style={s.card}>
        <SectionTitle>How often</SectionTitle>
        {[
          { id:"twice_daily", label:"Twice daily", sub:"Morning + nightly digest" },
          { id:"once_daily",  label:"Once daily",  sub:"Morning digest only" },
          { id:"weekly",      label:"Weekly",       sub:"One Sunday digest covering the whole week" },
        ].map(f => (
          <Row key={f.id} label={f.label} sub={f.sub}>
            <Radio on={config.schedule.frequency===f.id} onClick={() => update("schedule.frequency", f.id)} />
          </Row>
        ))}
      </div>
      <div style={s.card}>
        <SectionTitle>Times</SectionTitle>
        {freq === "weekly" ? (
          <div style={{ marginBottom:18 }}>
            <label style={s.label}>Weekly digest</label>
            <input type="time" style={s.input} value={config.schedule.morningTime} onChange={e => update("schedule.morningTime", e.target.value)} />
          </div>
        ) : (
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, marginBottom:18 }}>
            <div style={morningActive ? {} : dimStyle}>
              <label style={s.label}>Morning digest</label>
              <input type="time" style={s.input} value={config.schedule.morningTime} onChange={e => update("schedule.morningTime", e.target.value)} disabled={!morningActive} />
            </div>
            <div style={nightlyActive ? {} : dimStyle}>
              <label style={s.label}>Nightly digest</label>
              <input type="time" style={s.input} value={config.schedule.nightlyTime} onChange={e => update("schedule.nightlyTime", e.target.value)} disabled={!nightlyActive} />
            </div>
          </div>
        )}
        <label style={s.label}>Timezone</label>
        <select style={{ ...s.select, width:"100%" }} value={config.schedule.timezone} onChange={e => update("schedule.timezone", e.target.value)}>
          {TIMEZONES.map(tz => <option key={tz} value={tz}>{tz}</option>)}
        </select>
        <div style={{ marginTop:16 }}>
          <Row label="Skip weekends" sub="No digest on Saturday or Sunday">
            <Toggle on={!!config.schedule.skipWeekends} onChange={v => update("schedule.skipWeekends", v)} />
          </Row>
        </div>
      </div>
      </div>
      <div style={s.card}>
        <SectionTitle hint="how old can stories be?">Catch-up range</SectionTitle>
        <p style={{ fontFamily:F.body, fontSize:12.5, color:C.faint, marginTop:-6, marginBottom:14 }}>
          How far back NetRunner looks for stories on every run, scheduled or manual. 12 hours suits twice-daily digests; pick 24 hours for once daily. (The weekly digest always covers a week.)
        </p>
        {LOOKBACK_OPTIONS.map(o => (
          <Row key={o.id} label={o.label}>
            <Radio on={(config.schedule.lookbackWindow || "12h")===o.id} onClick={() => update("schedule.lookbackWindow", o.id)} />
          </Row>
        ))}
      </div>
    </div>
  );
}

}

function PasteIcon({ color }) {
  return (

function CopyBox({ label, value, height, filename }) {
  const [copied, setCopied] = useState(false);
  const handleCopy = async () => {
    try {
      await navigator.clipboard.writeText(value || "");
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch(e) { /* clipboard permission denied — user can still click-select the box */ }
  };
  const handleDownload = () => {
    const blob = new Blob([value || ""], { type: "text/markdown" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename || `${label.toLowerCase().replace(/[^a-z0-9]+/g, "-")}.md`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  return (
    <div style={{ marginBottom:16 }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8 }}>
        <span style={{ fontFamily:F.disp, fontSize:14, fontWeight:700, color:C.text, letterSpacing:"0.03em", textTransform:"uppercase" }}>{label}</span>
        <div style={{ display:"flex", gap:8 }}>
          <button onClick={handleDownload} style={{ ...s.btn, fontSize:12, padding:"6px 12px", background:"transparent", color:C.orange, border:`1px solid ${C.orangeLn}` }}>
            Download .md
          </button>
          <button onClick={handleCopy} style={{ ...s.btn, fontSize:12, padding:"6px 12px", background: copied ? C.green : "transparent", color: copied ? "#1a0d07" : C.orange, border:`1px solid ${copied ? C.green : C.orangeLn}` }}>
            {copied ? "✓ Copied" : "Copy"}
          </button>
        </div>
      </div>
      <textarea
        readOnly
        value={value}
        onClick={e => e.target.select()}
        style={{ ...s.input, height, resize:"vertical", fontFamily:F.mono, fontSize:12, lineHeight:1.55, cursor:"text" }}
      />
    </div>
  );
}

function PositionInput({ value, max, label, onCommit }) {
  const [text, setText] = useState(String(value));
  const commit = () => {
    const n = parseInt(text, 10);
    if (Number.isFinite(n) && n !== value) onCommit(n);
    else setText(String(value));
  };
  return (
    <input
      type="text" inputMode="numeric" aria-label={label} title={`Type 1–${max} and press Enter`}
      value={text}
      onChange={e => setText(e.target.value.replace(/[^0-9]/g, "").slice(0, 2))}
      onFocus={e => e.target.select()}
      onBlur={commit}
      onKeyDown={e => { if (e.key === "Enter") e.target.blur(); if (e.key === "Escape") { setText(String(value)); e.target.blur(); } }}
      style={{ ...s.input, width:44, padding:"5px 0", textAlign:"center", fontFamily:F.disp, fontSize:14, fontWeight:700, color:C.text }}
    />
  );
}

function FormatTab({ config, update }) {
  const order = config.format.sectionOrder;
  const cs = config.customSources || {};
  const hasCustom = (cs.rss?.length || 0) + (cs.youtube?.length || 0) + (cs.xcancel?.length || 0) > 0;

  useEffect(() => {
    if (hasCustom && !order.includes("Custom Feeds")) {
      update("format.sectionOrder", [...order, "Custom Feeds"]);
    } else if (!hasCustom && order.includes("Custom Feeds")) {
      update("format.sectionOrder", order.filter(s => s !== "Custom Feeds"));
    }
  }, [hasCustom]);

  const isVisible = sec => sec === "Custom Feeds" ? (hasCustom && config.topics[sec] !== false) : config.topics[sec] !== false;
  const visibleOrder = order.filter(isVisible);

  const moveVisible = (sec, dir) => {
    const next = [...order];
    const idx = next.indexOf(sec);
    let j = idx + dir;
    while (j >= 0 && j < next.length && !isVisible(next[j])) j += dir;
    if (j < 0 || j >= next.length) return;
    [next[idx], next[j]] = [next[j], next[idx]];
    update("format.sectionOrder", next);
  };

  // Typed position: move a section to slot `pos` (1-based) among the visible ones. Hidden sections keep
  // their slots in the saved order, so turning a topic back on puts it where it was.
  const moveTo = (sec, pos) => {
    const vis = visibleOrder.filter(x => x !== sec);
    const p = Math.max(1, Math.min(vis.length + 1, Math.round(pos)));
    vis.splice(p - 1, 0, sec);
    let k = 0;
    update("format.sectionOrder", order.map(x => isVisible(x) ? vis[k++] : x));
  };
  return (
    <div>
      <h1 style={{ ...s.h1, marginBottom:20 }}>Format</h1>
      <div style={s.card}>
        <SectionTitle>Summary length</SectionTitle>
        {[
          { id:"1",   label:"One sentence",   sub:"Ultra compact" },
          { id:"2-3", label:"2–3 sentences",  sub:"Default — context without bloat" },
          { id:"full",label:"Full detail",    sub:"Longer summaries per item" },
        ].map(o => (
          <Row key={o.id} label={o.label} sub={o.sub}>
            <Radio on={config.format.summaryLength===o.id} onClick={() => update("format.summaryLength", o.id)} />
          </Row>
        ))}
      </div>
      <div style={s.card}>
        <Row label="Show the Excluded list" sub="The 🗒️ EXCLUDED list at the end of each digest: stories the AI skipped and why (duplicate, stale, filler…). When off, it's left out of Discord, email, the saved file and the Output tab. It's still kept, so you can peek at it from Output.">
          <Toggle on={config.format.showExcluded !== false} onChange={v => update("format.showExcluded", v)} />
        </Row>
      </div>
      <div style={s.card}>
        <SectionTitle>Language</SectionTitle>
        <select style={{ ...s.select, width:"100%" }} value={config.format.language} onChange={e => update("format.language", e.target.value)}>
          {["English","Spanish","French","German","Japanese","Portuguese"].map(l => <option key={l} value={l}>{l}</option>)}
        </select>
      </div>
      <div style={s.card}>
        <SectionTitle hint="order sections appear in the digest">Section order</SectionTitle>
        <p style={{ fontFamily:F.body, fontSize:12.5, color:C.faint, marginTop:-6, marginBottom:14 }}>Type a new position in a section's number box and press Enter, or use the arrows. Topics turned off on the Topics tab are hidden here.</p>
        {visibleOrder.map((sec, i) => (
          <div key={sec} style={{ display:"flex", alignItems:"center", gap:13, padding:"10px 0", borderBottom:`1px solid ${C.border}` }}>
            <PositionInput key={`${sec}-${i}`} value={i+1} max={visibleOrder.length} label={`Position of ${sec}`} onCommit={p => moveTo(sec, p)} />
            <span style={{ flex:1, fontSize:15, fontFamily:F.body, color:C.text }}>{sec}</span>
            <button onClick={() => moveVisible(sec,-1)} disabled={i===0} style={{ ...s.btn, fontSize:13, background:"transparent", color: i===0 ? C.faint : C.body, padding:"4px 9px", border:`1px solid ${C.border}` }}>↑</button>
            <button onClick={() => moveVisible(sec,1)} disabled={i===visibleOrder.length-1} style={{ ...s.btn, fontSize:13, background:"transparent", color: i===visibleOrder.length-1 ? C.faint : C.body, padding:"4px 9px", border:`1px solid ${C.border}` }}>↓</button>
          </div>
        ))}
      </div>
    </div>
  );
}

function YouTubeResolveField({ items, onAddAll, onAddEntry, onRemove }) {
  const [urlInput, setUrlInput]       = useState("");
  const [bulkText, setBulkText]       = useState("");
  const [resolveState, setResolveState] = useState("idle"); // idle | running | success | error
  const [resolveError, setResolveError] = useState("");
  const [lastAdded, setLastAdded]     = useState(null);
  const [advanced, setAdvanced]       = useState(false);

  const resetSoon = () => setTimeout(() => setResolveState("idle"), 5000);

  // Resolve adds the channel straight away and shows who it found, so there's no raw ID to deal with.
  const handleResolve = async () => {
    if (!urlInput.trim()) return;
    setResolveState("running");
    setResolveError("");
    setLastAdded(null);
    try {
      const data = await api("/api/resolve-youtube", { method: "POST", body: { query: urlInput.trim() } });
      if (data && data.channelId) {
        const entry = { id: data.channelId, handle: data.handle || null, title: data.title || null, avatar: data.avatar || null };
        onAddEntry(entry);
        setLastAdded(entry);
        setResolveState("success");
        setUrlInput("");
      } else {
        setResolveState("error");
        setResolveError((data && data.error) || "Couldn't find that channel.");
      }
    } catch(e) {
      setResolveState("error");
      setResolveError((e.data && e.data.error) || e.message);
    }
    resetSoon();
  };

  const handleAddAll = () => {
    const lines = bulkText.split(/[\n,]+/).map(v => v.trim()).filter(Boolean);
    if (!lines.length) return;
    onAddAll(lines);
    setBulkText("");
  };

  const stateColor = resolveState === "success" ? C.green : resolveState === "error" ? C.red : C.orangeLn;

  return (
    <div style={{ marginBottom:26 }}>
      <label style={s.label}>YouTube channels</label>
      <p style={{ fontSize:13, fontFamily:F.body, color:C.muted, marginBottom:9 }}>Paste a channel link or @handle and press Add.</p>
      <div style={{ display:"flex", gap:8 }}>
        <input
          style={{ ...s.input, flex:1 }}

function CustomSourcesTab({ config, update }) {
  const addAll = (key, lines) => {
    const existing = config.customSources[key];
    const merged = [...existing];
    lines.forEach(v => { if (!merged.includes(v)) merged.push(v); });
    update(`customSources.${key}`, merged);
  };
  const addAllYoutube = (lines) => {
    const existingIds = new Set(config.customSources.youtube.map(item => typeof item === "object" ? item.id : item));
    const merged = [...config.customSources.youtube];
    lines.forEach(id => {
      if (!existingIds.has(id)) {
        merged.push({ id, handle: null });
        existingIds.add(id);
      }
    });
    update("customSources.youtube", merged);
  };
  // From Resolve: replaces an existing entry for the same channel so it picks up the name/avatar.
  const addYoutubeEntry = (entry) => {
    const rest = config.customSources.youtube.filter(item => (typeof item === "object" ? item.id : item) !== entry.id);
    update("customSources.youtube", [...rest, entry]);
  };
  const remove = (key, i) => {
    const next = [...config.customSources[key]];
    next.splice(i, 1);
    update(`customSources.${key}`, next);
  };

  return (
    <div>
      <h2 id="add-your-own" style={{ ...s.h1, fontSize:24, marginTop:30, marginBottom:6 }}>Add your own</h2>
      <p style={{ ...s.sub, marginBottom:18 }}>Your own RSS feeds and YouTube channels. They're fetched alongside the built-in sources and land in the Custom Feeds section.</p>
      <div style={s.card}>
        <CustomBulkField
          label="RSS feeds"
          sub="Paste one or more RSS feed URLs, one per line."
          items={config.customSources.rss}
          onAddAll={lines => addAll("rss", lines)}
          onRemove={i => remove("rss", i)}
          placeholder={"https://example.com/feed.xml\nhttps://another-site.com/rss"}
        />
        <YouTubeResolveField
          items={config.customSources.youtube}
          onAddAll={addAllYoutube}
          onAddEntry={addYoutubeEntry}
          onRemove={i => remove("youtube", i)}
        />
        <div style={{ marginBottom:26, opacity:0.5 }}>
          <label style={s.label}>X accounts <span style={{ marginLeft:8, fontFamily:F.mono, fontSize:10, letterSpacing:"0.04em", color:C.faint, textTransform:"none", border:`1px solid ${C.border}`, borderRadius:3, padding:"2px 7px" }}>COMING SOON</span></label>
          <p style={{ fontSize:13, fontFamily:F.body, color:C.muted, marginBottom:9 }}>Reading X accounts isn't available yet. Accounts already listed here are kept but not fetched.</p>
          <div style={{ marginTop:12, display:"flex", flexWrap:"wrap", gap:7 }}>
            {config.customSources.xcancel.map((item, i) => (
              <span key={i} style={s.tag}>
                {item}
                <span onClick={() => remove("xcancel", i)} style={{ cursor:"pointer", color:C.red, marginLeft:2, fontWeight:700 }}>✕</span>
              </span>
            ))}
            {!config.customSources.xcancel.length && <span style={{ fontSize:13, fontFamily:F.body, color:C.faint, fontStyle:"italic" }}>None added yet</span>}
          </div>
        </div>
      </div>
    </div>
  );
}

// "Covers the last 24 hours" — the Catch-up range the run used. Not shown for recaps or imported files.
const CATCH_UP_TEXT = { "12h":"last 12 hours", "24h":"last 24 hours", "3d":"last 3 days", "1w":"last week", "2w":"last 2 weeks", "1mo":"last month" };
const catchUpLabel = (e) => (e.mode === "weekly" || e.mode === "monthly" || !CATCH_UP_TEXT[e.lookback]) ? "" : `covers the ${CATCH_UP_TEXT[e.lookback]}`;

// Sections the Format/Topics toggles can hide. Saved digests always keep them; this only changes what's shown.
const HIDEABLE = [
  { id:"everythingElse", re:/Everything Else/i, label:"everything else" },
  { id:"excluded",       re:/EXCLUDED/i,        label:"excluded" },
];

// Line counts per hideable section, and the digest with the hidden ones removed.
function viewDigest(md, hidden) {
  const out = [], counts = {};
  let cur = null;
  for (const line of (md || "").split("\n")) {
    if (/^##\s/.test(line)) cur = HIDEABLE.find(h => h.re.test(line))?.id || null;
    if (cur && /^- /.test(line)) counts[cur] = (counts[cur] || 0) + 1;
    if (cur && !counts[cur]) counts[cur] = 0;
    if (!cur || !hidden[cur]) out.push(line);
  }
  return { text: out.join("\n").replace(/\n+(?:---+\s*)?$/, "\n"), counts };
}

function OutputTab({ entries, selectedId, onSelect, onRemove, onImport, showDefaults }) {

  const grouped = {};
  entries.forEach(e => { (grouped[e.date] = grouped[e.date] || []).push(e); });
  const dates = Object.keys(grouped).sort().reverse();
  const selected = entries.find(e => e.id === selectedId) || entries[0] || null;
  const view = selected ? viewDigest(selected.content, { excluded: !show.excluded, everythingElse: !show.everythingElse }) : null;

  const MODE_ICON = {
    morning:"🌅", nightly:"🌙", weekly:"📅", monthly:"🗓️", manual:"📄",
    "manual-chatgpt":"💬", "manual-claude":"🔶", "manual-gemini":"✨",
    "manual-grok":"🤖", "manual-deepseek":"🌊"
  };

  return (
    <div>
      <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", marginBottom:6 }}>
        <div>
          <h1 style={s.h1}>Output</h1>
          <p style={s.sub}>Digests saved here render like a reading pane — same idea as an Obsidian vault note, organized by date.</p>

        <button onClick={onImport} style={{ ...s.btn, background:"transparent", color:C.orange, border:`1px solid ${C.orangeLn}`, flexShrink:0 }}>+ Import .md</button>

      {entries.length === 0 ? (
        <div style={{ ...s.card, textAlign:"center", padding:"48px 24px", color:C.muted, fontFamily:F.body, fontSize:14 }}>

        </div>
      ) : (
        <div style={{ display:"grid", gridTemplateColumns:"230px minmax(0, 1fr)", gap:18, alignItems:"start" }}>
          {/* entry list */}
          <div style={{ ...s.card, padding:"10px 0", maxHeight:"70vh", overflowY:"auto" }}>
            {dates.map(date => (
              <div key={date} style={{ marginBottom:6 }}>
                <div style={{ fontFamily:F.mono, fontSize:11, color:C.muted, letterSpacing:"0.05em", padding:"8px 16px 4px" }}>{date}</div>
                {grouped[date].map(e => {
                  const active = selected && selected.id === e.id;
                  return (
                    <div key={e.id} onClick={() => onSelect(e.id)} style={{
                      display:"flex", alignItems:"center", justifyContent:"space-between", gap:6, padding:"8px 16px",
                      cursor:"pointer", background: active ? C.orangeDim : "transparent", borderLeft:`3px solid ${active ? C.orange : "transparent"}` }}>
                      <span style={{ fontFamily:F.body, fontSize:13, color: active ? C.orange : C.text, textTransform:"capitalize", display:"flex", alignItems:"center", gap:6 }}>
                        <span>{MODE_ICON[e.mode] || "📄"}</span>{e.mode}
                      </span>
                      <span onClick={ev => { ev.stopPropagation(); onRemove(e.id); }} style={{ color:C.faint, fontSize:12, cursor:"pointer" }}>✕</span>
                    </div>
                  );
                })}
              </div>
            ))}
          </div>

          {/* reading pane */}
          <div style={{ ...s.card, minHeight:"60vh", minWidth:0, overflowWrap:"anywhere" }}>
            {selected ? (
              <>
                <style>{MD_STYLE}</style>
                <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:18, paddingBottom:14, borderBottom:`1px solid ${C.border}` }}>
                  <span style={{ fontSize:18 }}>{MODE_ICON[selected.mode] || "📄"}</span>
                  <div>
                    <div style={{ fontFamily:F.disp, fontSize:16, fontWeight:700, color:C.text, textTransform:"capitalize" }}>{selected.mode} — {selected.date}</div>
                    <div style={{ fontFamily:F.mono, fontSize:11, color:C.faint }}>saved {new Date(selected.savedAt).toLocaleString()}</div>
                    {catchUpLabel(selected) && <div style={{ fontFamily:F.body, fontSize:12.5, color:C.orange, marginTop:2 }}>Catch-up range: {catchUpLabel(selected).replace(/^covers the /, "")}</div>}
                  </div>

                      <button key={h.id} onClick={() => setShow(v => ({ ...v, [h.id]: !v[h.id] }))} style={{ ...s.btn, fontSize:13, padding:"6px 12px", background:"transparent", color: show[h.id] ? C.orange : C.muted, border:`1px solid ${show[h.id] ? C.orangeLn : C.border}` }}>
                        {show[h.id] ? "Hide" : "Show"} {h.label} ({view.counts[h.id]})
                      </button>
                    ))}
                  </div>

                <div className="md-reader" dangerouslySetInnerHTML={{ __html: renderMD(view.text) }} />

            ) : (

            )}
          </div>
        </div>
      )}
    </div>
  );
}

function DigestConfig() {
  const [config, setConfig] = useState(deepClone(DEFAULT_CONFIG));
  const [tab, setTab]       = useState("templates");
  const [flash, setFlash]   = useState(null);
  const [layout, setLayout] = useState(() => localStorage.getItem("nr_layout") || "tabs");
  const [bg, setBg]         = useState(() => localStorage.getItem("nr_bg") || "off");
  const [n8nStatus, setN8nStatus] = useState("checking"); // server status (name kept to minimise UI churn)
  const [secrets, setSecrets] = useState({}); // which keys are set in the server's .env (never the values)
  const [keys, setKeys] = useState({});       // per-key status for the editable .env fields (never secret values)
  const saveKeys = async (updates) => {
    const res = await api("/api/keys", { method:"PUT", body: updates });
    setKeys(res.keys || {});
    setSecrets(res.secrets || {});
  };
  const [runState, setRunState] = useState("idle"); // idle | running | success | error

  const [runError, setRunError] = useState("");
  const [promptResult, setPromptResult]     = useState(null);
  const [promptParts, setPromptParts]       = useState(null);
  const [promptRunState, setPromptRunState] = useState("idle");
  // Output history lives on the server (GET /api/digests) — survives cache clears, and
  // includes every scheduled run, not just ones started from this browser.
  const [outputEntries, setOutputEntries] = useState([]);
  const [selectedEntryId, setSelectedEntryId] = useState(null);

  const refreshEntries = async () => {
    try {
      const { digests } = await api("/api/digests");
      setOutputEntries(digests.map(d => ({ id: d.id, date: d.date, mode: d.mode, savedAt: d.createdAt, content: d.content, lookback: d.lookback })));
    } catch(e) { /* server offline — badge already shows it */ }
  };

  // existingId: the run already saved this digest server-side; otherwise POST it (imports).
  const addEntry = async (date, mode, content, navigate = true, existingId = null) => {
    let id = existingId;
    try {
      if (!id) id = (await api("/api/digests", { method: "POST", body: { date, mode, content } })).id;
    } catch(e) { window.alert("Couldn't save to Output: " + e.message); return; }
    await refreshEntries();
    setSelectedEntryId(id);
    if (navigate) setTab("output");
  };

  const removeEntry = async (id) => {
    try { await api(`/api/digests/${id}`, { method: "DELETE" }); } catch(e) { window.alert("Couldn't delete: " + e.message); return; }
    if (selectedEntryId === id) setSelectedEntryId(null);
    refreshEntries();
  };

  const importMdFile = async () => {
    try {
      const [handle] = await window.showOpenFilePicker({ types:[{ description:"Markdown", accept:{"text/markdown":[".md",".txt"]} }] });
      const file = await handle.getFile();
      const text = await file.text();
      const name = file.name.replace(/\.(md|txt)$/i, "");
      const dateMatch = name.match(/(\d{4}-\d{2}-\d{2})/);
      const modeMatch = name.match(/(morning|nightly|weekly|monthly)/i);
      const date = dateMatch ? dateMatch[1] : new Date().toISOString().slice(0,10);
      const mode = modeMatch ? modeMatch[1].toLowerCase() : "manual";
      addEntry(date, mode, text);
    } catch(e) { if (e.name !== "AbortError") window.alert("Couldn't read that file: " + e.message); }
  };

  // Save first so the server always runs with exactly what's on screen.
  const persistConfig = async () => {
    const res = await api("/api/config", { method: "PUT", body: config });
    setConfig(res.config);
    setSecrets(res.secrets || {});
    return res.config;
  };

  const runNow = async () => {
    setRunState("running");
    setRunError("");
    try {
      const saved = await persistConfig();
      // 6 min — Gemini with search grounding can genuinely take 1-2 min, plus fallbacks
      const payload = await api("/api/run", { method: "POST", timeoutMs: 360000,
        body: { lookbackWindow: saved.schedule.lookbackWindow || "12h" } });
      setRunState("success");
      if (payload && payload.digest) {
        const date = payload.date || new Date().toISOString().slice(0,10);
        await addEntry(date, payload.mode || "manual", payload.digest, true, payload.digestId);
      }
      setTimeout(() => setRunState("idle"), 4000);
    } catch(e) {
      setRunState("error");
      setRunError(e.status === 409 ? "A run is already in progress — wait for it to finish." : e.message);
      setTimeout(() => setRunState("idle"), 6000);
    }
  };

  const runForPrompt = async () => {
    setPromptRunState("running");
    setPromptResult(null);
    setPromptParts(null);
    try {
      const saved = await persistConfig();
      const payload = await api("/api/prompt", { method: "POST", timeoutMs: 360000,
        body: { lookbackWindow: saved.schedule.lookbackWindow || "12h" } });
      if (payload?.digest) {
        setPromptResult(payload.digest);
        setPromptParts({
          howToUse: payload.howToUse || '',
          systemInstructions: payload.systemInstructions || '',
          userRequest: payload.userRequest || ''
        });
        setPromptRunState("success");
        const date = payload.date || new Date().toISOString().slice(0,10);
        await addEntry(date, payload.mode || "manual", payload.digest, false, payload.digestId);
      } else {
        setPromptRunState("error");
      }
      setTimeout(() => setPromptRunState("idle"), 4000);
    } catch(e) {
      setPromptRunState("error");
      setTimeout(() => setPromptRunState("idle"), 6000);
    }
  };

  useEffect(() => { localStorage.setItem("nr_layout", layout); }, [layout]);
  useEffect(() => { localStorage.setItem("nr_bg", bg); }, [bg]);
  useEffect(() => {
    const checkServer = async () => {
      try { await api("/api/health", { timeoutMs: 2500 }); setN8nStatus("connected"); }
      catch(e) { setN8nStatus("offline"); }
    };
    checkServer();
    const interval = setInterval(checkServer, 28000);
    return () => clearInterval(interval);
  }, []);

  // Load the saved config + output history from the server on open.
  useEffect(() => {
    (async () => {
      try {
        const res = await api("/api/config");
        setConfig(res.config);
        setSecrets(res.secrets || {});
        setKeys(res.keys || {});
        setFlash("loaded");
        setTimeout(() => setFlash(null), 2500);
      } catch(e) { setFlash("error"); setTimeout(() => setFlash(null), 2500); }
      await refreshEntries();
      // Opened by a scheduled run (Delivery → Open in NetRunner): /?digest=<id>
      const digestId = Number(new URLSearchParams(location.search).get("digest"));
      if (digestId) {
        setSelectedEntryId(digestId);
        setTab("output");
        history.replaceState(null, "", location.pathname);
      }
    })();
  }, []);

  // Pick up digests saved by scheduled runs while the window was open.
  useEffect(() => { if (tab === "output") refreshEntries(); }, [tab]);

  const update = (path, value) => setConfig(prev => setPath(prev, path, value));

  const updateLLMPrimary = (model) => {
    const all = ["gemini", "claude", "ollama"];
    const fallback = all.filter(x => x !== model);
    setConfig(prev => {
      const next = deepClone(prev);
      next.llm.primary = model;
      next.llm.fallbackChain = fallback;
      return next;
    });
  };

  const applyTemplate = (id) => {
    setConfig(deepClone(id === "blank" ? BLANK_CONFIG : DEFAULT_CONFIG));
    setTab("topics");
  };

  const tabIndex = TABS.findIndex(t => t.id === tab);
  const goNext = () => { if (tabIndex < TABS.length - 1) setTab(TABS[tabIndex + 1].id); };
  const goPrev = () => { if (tabIndex > 0) setTab(TABS[tabIndex - 1].id); };
  const isLast = tabIndex === TABS.length - 1;

  const saveConfig = async () => {
    try {
      await persistConfig();
      setFlash("saved");
    } catch(e) {
      setFlash("error");
      window.alert("Config not saved:\n" + e.message);
    }
    setTimeout(() => setFlash(null), 2500);
  };

  // "Load" = discard unsaved edits and reload what the server has.
  const loadConfig = async () => {
    try {
      const res = await api("/api/config");
      setConfig(res.config);
      setSecrets(res.secrets || {});
      setFlash("loaded");
    } catch(e) { setFlash("error"); }
    setTimeout(() => setFlash(null), 2500);
  };

  const enabledTopics  = TOPICS.filter(t => config.topics[t]).length;
  const enabledSources = Object.entries(config.sources).filter(([src, on]) => on && COUNTABLE_SOURCE_SET.has(src)).length + config.customSources.rss.length + config.customSources.youtube.length;

  const content = (
    <KeysCtx.Provider value={{ keys, saveKeys }}>
      {tab === "templates" && <TemplatesTab onApply={applyTemplate} />}
      {tab === "topics"    && <TopicsTab    config={config} update={update} />}
      {tab === "sources"   && <React.Fragment><SourcesTab config={config} update={update} /><CustomSourcesTab config={config} update={update} /></React.Fragment>}
      {tab === "delivery"  && <DeliveryTab  config={config} update={update} secrets={secrets} />}
      {tab === "schedule"  && <React.Fragment><ScheduleTab config={config} update={update} /><RollupsTab config={config} update={update} /></React.Fragment>}
      {tab === "llm"       && <LLMTab       config={config} update={update} updateLLMPrimary={updateLLMPrimary} runForPrompt={runForPrompt} promptResult={promptResult} promptParts={promptParts} promptRunState={promptRunState} secrets={secrets} />}
      {tab === "format"    && <FormatTab    config={config} update={update} />}
      {tab === "output"    && <OutputTab showDefaults={{ excluded: config.format.showExcluded !== false, everythingElse: config.format.showEverythingElse !== false }} entries={outputEntries} selectedId={selectedEntryId} onSelect={setSelectedEntryId} onRemove={removeEntry} onImport={importMdFile} />}
    </KeysCtx.Provider>
  );

  // ── small shared bits ──
  const bgCycle = () => setBg(BG_PATTERNS[(BG_PATTERNS.indexOf(bg) + 1) % BG_PATTERNS.length]);

  const ControlChips = ({ dark }) => (
    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
      <button onClick={bgCycle} title="Cycle background pattern" style={{ fontFamily:F.mono, fontSize:11, color:C.body, background:C.pill, border:`1px solid ${C.border}`, borderRadius:4, padding:"6px 10px", cursor:"pointer", letterSpacing:"0.02em" }}>
        ▥ {BG_LABEL[bg]}
      </button>
      <div style={{ display:"inline-flex", border:`1px solid ${C.border}`, borderRadius:4, overflow:"hidden" }}>
        {[["tabs","Tabs"],["rail","Sidebar"]].map(([id,lbl]) => (
          <button key={id} onClick={() => setLayout(id)} style={{ fontFamily:F.mono, fontSize:11, padding:"6px 10px", border:"none", cursor:"pointer",
            background: layout===id ? C.orange : "transparent", color: layout===id ? "#1a0d07" : C.muted }}>{lbl}</button>
        ))}
      </div>
    </div>
  );

  const StatPair = () => (
    <div style={{ display:"flex", gap:10 }}>
      {[["topics", enabledTopics],["sources", enabledSources]].map(([k,v]) => (
        <div key={k} style={{ textAlign:"center", minWidth:62, border:`1px solid ${C.border}`, borderRadius:4, padding:"6px 10px", background:C.panel2 }}>
          <div style={{ fontFamily:F.disp, fontSize:22, fontWeight:700, color:C.orange, lineHeight:1 }}>{v}</div>
          <div style={{ fontFamily:F.body, fontSize:10, color:C.muted, letterSpacing:"0.08em", marginTop:3, textTransform:"uppercase" }}>{k}</div>
        </div>
      ))}
    </div>
  );

  // ── BOTTOM ACTION BAR (Back / status / Run / Save / Next) ──
  const ActionBar = () => (
    <div style={{ display:"grid", gridTemplateColumns:"auto 1fr auto", alignItems:"center", gap:14, padding:"15px 32px", borderTop:`1px solid ${C.border}`, background:C.bg2, position:"relative", zIndex:2 }}>
      <div style={{ display:"flex", alignItems:"center", gap:14, minWidth:0 }}>
        <button onClick={goPrev} disabled={tabIndex===0} style={{ ...s.btn, flexShrink:0, background:"transparent", color: tabIndex===0 ? C.faint : C.body, border:`1px solid ${C.border}` }}>← Back</button>
        <div style={{ display:"flex", alignItems:"center", gap:8, fontFamily:F.mono, fontSize:11.5, color:C.muted, letterSpacing:"0.03em", overflow:"hidden", whiteSpace:"nowrap" }}>
          <span style={{ width:7, height:7, borderRadius:"50%", flexShrink:0, background: n8nStatus==="connected" ? C.green : n8nStatus==="offline" ? C.red : C.muted, boxShadow:`0 0 8px ${n8nStatus==="connected" ? C.green : n8nStatus==="offline" ? C.red : C.muted}` }} />
          <span title={window.location.host} style={{ overflow:"hidden", textOverflow:"ellipsis", fontFamily:F.body, fontSize:12.5 }}>
            {n8nStatus==="connected" ? "Connected to local server" : n8nStatus==="offline" ? "Server offline — reopen NetRunner" : "Connecting…"}
          </span>
        </div>
        {flash && (
          <span style={{ fontFamily:F.mono, fontSize:12, color: flash==="error" ? C.red : C.green, letterSpacing:"0.03em", flexShrink:0 }}>
            {flash==="saved" ? "✓ config saved" : flash==="loaded" ? "✓ config loaded" : "✕ error"}
          </span>
        )}
      </div>
      <div style={{ display:"flex", flexDirection:"column", alignItems:"center", minWidth:0, position:"relative" }}>
        <div style={{ display:"flex", alignItems:"center", gap:6 }}>
          <button onClick={runNow} disabled={runState==="running"} style={{ ...s.btn,
            display:"flex", alignItems:"center", gap:"clamp(6px,0.8vw,9px)", cursor: runState==="running" ? "default" : "pointer",
            background:"transparent",
            color: runState==="success" ? C.green : runState==="error" ? C.red : C.orange,
            border:`1px solid ${runState==="success" ? C.green : runState==="error" ? C.red : C.orangeLn}`,
            fontSize:"clamp(12px, 1.1vw, 15px)", padding:"clamp(8px,1vw,10px) clamp(16px,2vw,22px)",
            whiteSpace:"nowrap", opacity: runState==="running" ? 0.7 : 1 }}>
            <span style={{ fontSize:"0.85em", lineHeight:1 }}>{runState==="running" ? "◌" : runState==="success" ? "✓" : runState==="error" ? "✕" : "▶"}</span>
            {runState==="running" ? "Running…" : runState==="success" ? "Digest Sent" : runState==="error" ? "Run Failed" : "Run News Digest"}
          </button>
        </div>
        {runState==="error" && runError && (
          <div style={{ position:"absolute", top:"100%", marginTop:8, width:340, maxWidth:"60vw", background:C.panel, border:`1px solid ${C.redLn}`, borderRadius:5, padding:"9px 12px", fontFamily:F.mono, fontSize:11, color:C.red, lineHeight:1.5, zIndex:10, boxShadow:"0 8px 24px rgba(0,0,0,.5)" }}>
            {runError}
          </div>
        )}
      </div>
      <div style={{ display:"flex", alignItems:"center", gap:10, flexShrink:0 }}>
        <button onClick={loadConfig} style={{ ...s.btn, background:"transparent", color:C.muted, border:`1px solid ${C.border}` }}>Load</button>
        <button onClick={saveConfig} style={{ ...s.btn, background:"transparent", color:C.orange, border:`1px solid ${C.orangeLn}` }}>Save</button>
        <button onClick={isLast ? saveConfig : goNext} style={{ ...s.btn, background:C.orange, color:"#1a0d07", boxShadow:`0 0 18px ${C.orange}44`, clipPath:NOTCH, paddingRight:24 }}>
          {isLast ? "Finish ✓" : "Next →"}
        </button>
      </div>
    </div>
  );

  // ── TOP-TAB LAYOUT (Cyberpunk settings style) ──
  if (layout === "tabs") {
    return (
      <div style={{ display:"flex", flexDirection:"column", height:"100vh", fontFamily:F.body, background:C.bg, color:C.text, overflow:"hidden", position:"relative" }}>
        <GlitchBG pattern={bg} />
        {/* top bar */}
        <div style={{ position:"relative", zIndex:2, background:C.bg2, borderBottom:`1px solid ${C.border}` }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"16px 32px 14px", gap:20 }}>
            <Logo />
            <div style={{ display:"flex", alignItems:"center", gap:16 }}>
              <StatPair />
              <N8nBadge status={n8nStatus} />
              <ControlChips />
            </div>
          </div>
          {/* horizontal tabs */}
          <div style={{ display:"flex", alignItems:"center", gap:4, padding:"0 26px", flexWrap:"wrap" }}>
            {TABS.map((t, i) => {
              const active = tab===t.id;
              return (
                <button key={t.id} onClick={() => setTab(t.id)} style={{ position:"relative", display:"flex", alignItems:"center", gap:8, padding:"12px 16px 14px", border:"none", background:"transparent", cursor:"pointer",
                  fontFamily:F.disp, fontSize:17, fontWeight:700, letterSpacing:"0.05em", textTransform:"uppercase",
                  color: active ? C.cyan : C.body, transition:"color .12s" }}
                  onMouseEnter={e => { if(!active) e.currentTarget.style.color = C.orange; }}
                  onMouseLeave={e => { if(!active) e.currentTarget.style.color = C.body; }}>
                  <span style={{ fontFamily:F.mono, fontSize:10, color: active ? C.cyan : C.faint, fontWeight:400 }}>{String(i+1).padStart(2,"0")}</span>
                  {t.label}
                  {active && <span style={{ position:"absolute", left:12, right:12, bottom:0, height:2, background:C.cyan, boxShadow:`0 0 10px ${C.cyan}` }} />}
                </button>
              );
            })}
          </div>
        </div>
        {/* content */}
        <div style={{ flex:1, overflowY:"auto", position:"relative", zIndex:1 }}>
          <div style={{ maxWidth:920, margin:"0 auto", padding:"34px 32px 48px" }}>{content}</div>
        </div>
        <ActionBar />
      </div>
    );
  }

  // ── LEFT-RAIL LAYOUT ──
  return (
    <div style={{ display:"flex", height:"100vh", fontFamily:F.body, background:C.bg, color:C.text, overflow:"hidden", position:"relative" }}>
      <GlitchBG pattern={bg} />
      {/* sidebar */}
      <div style={{ width:250, background:C.bg2, borderRight:`1px solid ${C.border}`, display:"flex", flexDirection:"column", position:"relative", zIndex:2 }}>
        <div style={{ padding:"20px 20px 16px", borderBottom:`1px solid ${C.border}` }}>
          <Logo />
          <div style={{ marginTop:14 }}><N8nBadge status={n8nStatus} /></div>
        </div>
        <div style={{ padding:"14px 16px", borderBottom:`1px solid ${C.border}` }}><StatPair /></div>
        <nav style={{ flex:1, overflowY:"auto", padding:"10px 0" }}>
          {TABS.map((t, i) => {
            const active = tab===t.id;
            return (
              <button key={t.id} onClick={() => setTab(t.id)} style={{ display:"flex", alignItems:"center", gap:11, width:"100%", textAlign:"left", padding:"11px 20px 11px 17px", border:"none",
                background: active ? C.cyanDim : "transparent", cursor:"pointer", fontFamily:F.disp, fontSize:17, fontWeight:700, letterSpacing:"0.04em", textTransform:"uppercase",
                color: active ? C.cyan : C.body, borderLeft:`3px solid ${active ? C.cyan : "transparent"}`, transition:"all .14s" }}
                onMouseEnter={e => { if(!active) e.currentTarget.style.color = C.orange; }}
                onMouseLeave={e => { if(!active) e.currentTarget.style.color = C.body; }}>
                <span style={{ fontFamily:F.mono, fontSize:10, color: active ? C.cyan : C.faint, fontWeight:400 }}>{String(i+1).padStart(2,"0")}</span>
                {t.label}
              </button>
            );
          })}
        </nav>
        <div style={{ padding:"14px 16px", borderTop:`1px solid ${C.border}` }}><ControlChips /></div>
      </div>
      {/* main */}
      <div style={{ flex:1, display:"flex", flexDirection:"column", position:"relative", zIndex:1, minWidth:0 }}>
        <div style={{ flex:1, overflowY:"auto" }}>
          <div style={{ maxWidth:880, margin:"0 auto", padding:"34px 36px 48px" }}>{content}</div>
        </div>
        <ActionBar />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(DigestConfig));
</script>
<script>
window.addEventListener('load', async function() {
  var src = document.getElementById('nr-src').textContent;
  try {
    var res = await fetch('/api/catalog');
    if (!res.ok) throw new Error('GET /api/catalog → HTTP ' + res.status);
    window.NR_CATALOG = await res.json();
  } catch(e) {
    document.getElementById('root').innerHTML =
      '<pre style="color:#ff6d3a;background:#0c0809;padding:30px;font:13px monospace;white-space:pre-wrap;margin:0;min-height:100vh">' +
      ('Could not reach the NetRunner server.\nStart it with `npm start` and reload this page.\n\n' + e.message).replace(/</g,'&lt;') + '</pre>';
    return;
  }
  try {
    var compiled = Babel.transform(src, {
      filename: 'app.jsx',
      presets: [['react', { runtime: 'classic' }]]
    }).code;
    var script = document.createElement('script');
    script.textContent = compiled;
    document.body.appendChild(script);
  } catch(e) {
    document.getElementById('root').innerHTML =
      '<pre style="color:#ff6d3a;background:#0c0809;padding:30px;font:13px monospace;white-space:pre-wrap;margin:0;min-height:100vh">' +
      ('Compile error:\n' + (e.stack || e.message)).replace(/</g,'&lt;') + '</pre>';
  }
});
</script>
</body>
</html>
